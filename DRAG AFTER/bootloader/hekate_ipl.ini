[config]
updater2p=1

[Atmosphere Emu-Nand]
pkg3=atmosphere/package3
kip1=atmosphere/kips/*
emummcforce=1
icon=bootloader/res/icon_emu.bmp
cal0blank=1

[Atmosphere Sys-Nand]
pkg3=atmosphere/package3
kip1=atmosphere/kips/*
emummc_force_disable=1
icon=bootloader/res/icon_sys.bmp

[Stock Switch]
pkg3=atmosphere/package3
emummc_force_disable=1
stock=1
icon=bootloader/res/icon_stock.bmp